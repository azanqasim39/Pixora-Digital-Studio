<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found (404) — PIXORA DIGITAL STUDIO</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .error-wrapper {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }
    .error-card {
      max-width: 600px;
      background: var(--navy-800);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-xl);
      padding: 50px 36px;
      box-shadow: var(--shadow-lg);
    }
    .error-code {
      font-size: 5.5rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--blue-500) 0%, var(--cyan-400) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .error-heading {
      font-size: 1.6rem;
      color: #FFFFFF;
      margin-bottom: 14px;
      font-weight: 700;
    }
    .error-text {
      color: #94A3B8;
      font-size: 0.98rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .error-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="/" class="nav-brand" aria-label="Pixora Digital Studio Home">
        <img src="assets/images/pixora-logo.svg" alt="PIXORA DIGITAL STUDIO Logo" class="brand-logo-img">
      </a>
      <div class="nav-actions">
        <a href="/#contact" class="btn btn-primary btn-sm">
          <span>Let's Talk</span>
          <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="error-wrapper">
      <div class="error-card">
        <div class="error-code">404</div>
        <h1 class="error-heading">Page Not Found</h1>
        <p class="error-text">
          The page or digital experience you are looking for doesn't exist, has been relocated, or is temporarily unavailable.
        </p>
        <div class="error-actions">
          <a href="/" class="btn btn-primary">
            <i class="fa-solid fa-house"></i>
            <span>Return to Home</span>
          </a>
          <a href="/#portfolio" class="btn btn-secondary">
            <i class="fa-solid fa-shapes"></i>
            <span>View Featured Work</span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom-bar" style="border-top: none; justify-content: center;">
      <div>&copy; 2026 PIXORA DIGITAL STUDIO. All rights reserved.</div>
    </div>
  </footer>

</body>
</html>
